<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Desactivar vehicle · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/office :: topbar}"></div>

<div class="app">
    <input type="checkbox" id="side" class="side-toggle" aria-label="Menú de gestió">
    <div th:replace="~{fragments/office :: sidebar(activeMenu='vehicles')}"></div>
    <div class="scrim" aria-hidden="true"></div>

    <main class="main">
        <div class="page-head">
            <h1>Desactivar vehicle</h1>
            <p th:text="${vehicle.marca} + ' ' + ${vehicle.model} + ' (' + ${vehicle.matricula} + ')'">Vehicle</p>
        </div>

        <div class="alert err" role="alert" th:if="${errorNegoci}">
            <strong th:text="${errorNegoci}"></strong>
        </div>

        <form th:action="@{/vehicles/{id}/desactivar(id=${vehicle.id})}" method="post" class="card" style="max-width: 500px;">
            <div class="field">
                <label for="motiu">Motiu de la desactivació</label>
                <textarea id="motiu" name="motiu" class="textarea" rows="3" aria-label="Motiu desactivació" placeholder="Ex: Reparació, manteniment, temporada baixa..."></textarea>
            </div>

            <div class="field">
                <label for="dataFiDesactivacio">Data fi de desactivació (opcional)</label>
                <input id="dataFiDesactivacio" name="dataFiDesactivacio" type="date" class="input" min="2024-01-01">
                <div class="hint">Si s'omet, la desactivació no té data de finalització prevista.</div>
            </div>

            <div class="alert info" style="margin-top: 16px;">
                <strong>Nota:</strong> No es podrà desactivar si el vehicle té reserves actives, pendents o en curs que solapin amb el període indicat.
            </div>

            <div class="btn-row" style="margin-top: 20px;">
                <button class="btn btn-warning btn-block" type="submit">Desactivar</button>
                <a class="btn btn-outline btn-block" th:href="@{/vehicles}">Cancel·la</a>
            </div>
        </form>
    </main>
</div>

</body>
</html>
