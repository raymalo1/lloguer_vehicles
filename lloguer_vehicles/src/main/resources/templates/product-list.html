<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Products list</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><!-- comment -->

    </head>
    <body>
        <div></div>

        <div class="container-fluid text-center mt-5">
            <div class="row">
                <div class="col">
                                                                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Id</th>
                                <th scope="col">Title</th>
                                <th scope="col">Price</th>
                                <th scope="col">Quantity</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>

                        <p>Products listed: <span th:text="${#lists.size(products)}"></span></p>

                        <tr th:each="product : ${products}">
                            <th scope="row" th:text="${product.getId}"></th>
                            <td th:text="${product.title}"></td>
                            <td th:text="${product.price}"></td>
                            <td th:text="${product.quantity}"></td>
                            <td>
                                <!-- es genera una url dinàmica on {id} es substitureix per el valor definit a id=${product.id}-->
                                <a class="btn btn-success" th:href="@{/web/products/edit/{id}(id=${product.id})}">Edit</a>
                                <a class="btn btn-danger" th:href="@{/web/products/delete/{id}(id=${product.id})}">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a class="btn btn-success" th:href="@{/web/products/new}">New</a>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
