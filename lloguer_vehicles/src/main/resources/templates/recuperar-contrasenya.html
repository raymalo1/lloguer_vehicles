
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Recupera la contrasenya · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/loading.js}" defer></script>
</head>

<body>
<main class="container">
    <div class="reset-container">
        <section class="reset-card">

            <p><strong>Recuperació de la contrasenya</strong></p>

            <h1>Has oblidat la contrasenya?</h1>

            <p>
                Introdueix el correu electrònic del teu compte
                per iniciar el procés de recuperació.
            </p>

            <div class="error-message"
                 role="alert"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <div class="info-message"
                 role="status"
                 th:if="${notice != null}"
                 th:text="${notice}">
            </div>

            <form th:action="@{/recuperar-contrasenya}" method="post"
                  class="js-loading"
                  data-loading-message="Enviant correu de recuperació... Si us plau, espera">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="field">
        <label for="email">Correu electrònic</label>

                    <input class="input"
                           id="email"
                           name="email"
                           type="email"
                           placeholder="nom@gmail.com"
                           autocomplete="email"
                           maxlength="254"
                           th:value="${email}"
                           required>
                </div>

                <button class="btn btn-block reset-button" type="submit">
                    Sol·licita la recuperació
                </button>
            </form>

            <p style="margin-top: 18px;">
                <a th:href="@{/login}">
                    ← Torna a l'inici de sessió
                </a>
            </p>

        </section>
    </div>
</main>
</body>
</html>
