
<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e2a5e">
    <title>Nova contrasenya · Nothingan Pri S.A.</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<main class="container">
    <div class="reset-container">
        <section class="reset-card">

            <p><strong>Recuperació de la contrasenya</strong></p>

            <h1>Nova contrasenya</h1>

            <div class="error-message"
                 role="alert"
                 th:if="${error != null}"
                 th:text="${error}">
            </div>

            <div class="info-message"
                 role="status"
                 th:if="${notice != null}"
                 th:text="${notice}">
            </div>

            <!-- Si el token es válido, mostramos el formulario -->
            <div th:if="${token != null}">

                <p>
                    Introdueix la teva nova contrasenya
                    i confirma-la per continuar.
                </p>

                <form th:action="@{/reset-password}" method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <input type="hidden"
                           name="token"
                           th:value="${token}">

                    <div class="field">
                        <label for="password">Nova contrasenya</label>

                        <input class="input"
                               id="password"
                               name="password"
                               type="password"
                               placeholder="Nova contrasenya"
                               autocomplete="new-password"
                               minlength="8"
                               required>
                    </div>

                    <div class="field">
                        <label for="confirmarPassword">
                            Confirma la contrasenya
                        </label>

                        <input class="input"
                               id="confirmarPassword"
                               name="confirmarPassword"
                               type="password"
                               placeholder="Repeteix la contrasenya"
                               autocomplete="new-password"
                               minlength="8"
                               required>
                    </div>

                    <button class="btn btn-block reset-button"
                            type="submit">
                        Canvia la contrasenya
                    </button>

                </form>

            </div>

            <p style="margin-top: 18px;">
                <a th:href="@{/login}">
                    ← Torna a l'inici de sessió
                </a>
            </p>

        </section>
    </div>
</main>

</body>
</html>
