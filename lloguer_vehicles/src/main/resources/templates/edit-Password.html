<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Users</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><!-- comment -->
    </head>
    <body>
        <div class="container mt-5">
            <h2 class="mb-4">editPassword</h2>

           <form th:action="@{/web/users/updatepw}" method="post" th:object="${user}" class="needs-validation" novalidate>
                <!-- Campo oculto para enviar el ID del usuario -->
                <input type="hidden" th:field="*{login}" />

                <!-- Nueva contraseña -->
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" id="newPassword" th:field="*{pw}" class="form-control" required>
                </div>

                <!-- Confirmar nueva contraseña -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm new password</label>
                    <input type="password" id="confirmPassword" th:field="*{pw2}" class="form-control" required>
                </div>
                <!-- Botones -->
                <button type="submit" class="btn btn-primary">Update</button>
                <a th:href="@{/web/users/all}" class="btn btn-secondary">Exit</a>

                <!-- Mensaje de respuesta -->
                <div th:if="${message != null}"
                     th:text="${message}"
                     class="mt-3">
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
