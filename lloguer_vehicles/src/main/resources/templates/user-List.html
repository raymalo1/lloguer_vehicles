<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>userList</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><!-- comment -->
    </head>
    <body>
        <div></div>
        <div class="container-fluid text-center mt-5">
            <div class="row">
                <div class="col">

                    <form th:action="@{/web/products/all}" method="get" class="d-inline">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-box-arrow-right"></i> Products
                        </button>
                    </form>

                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Login</th>
                                <th scope="col">Name</th>
                                <th scope="col">Authorities</th>
                            </tr>
                        </thead>
                        <tbody>

                        <p>Total users: <span th:text="${#lists.size(users)}"></span></p>

                        <tr th:each="user : ${users}">
                            <th scope="row" th:text="${user.login}"></th>
                            <td th:text="${user.name}"></td>
                            <td th:text="${#strings.listJoin(user.userAuthorities, ', ')}"></td>

                            <td>
                                <!-- es genera una url dinàmica on {id} es substitueix pel valor definit a id=${user.login}-->
                                <a class="btn btn-success" th:href="@{/web/users/edit/{id}(id=${user.login})}">Edit</a>
                                <a class="btn btn-success" th:href="@{/web/users/editpw/{id}(id=${user.login})}">Reset Password</a>
                                <a class="btn btn-danger"  th:href="@{/web/users/delete/{id}(id=${user.login})}">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a class="btn btn-success" th:href="@{/web/users/new}">New</a>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
